<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />

    <meta name="author" content="SkyOne International Courier Service" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.skyoneinternational.com/" />

    <meta property="og:site_name" content="SkyOne International Courier Service" />
    <meta property="og:title" content="International Courier from Kerala | SkyOne Courier" />
    <meta property="og:description" content="Send parcels, documents and NRI papers from Kerala to the USA, UK, Canada, UAE and worldwide. Doorstep pickup across Kerala. Request a quote." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.skyoneinternational.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="International Courier from Kerala | SkyOne Courier" />
    <meta name="twitter:description" content="Send parcels, documents and NRI papers from Kerala to the USA, UK, Canada, UAE and worldwide. Doorstep pickup across Kerala." />
    <meta name="theme-color" content="#024BB2" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/skyone_logo_clean.png" />
    <link rel="apple-touch-icon" href="/skyone_logo_clean.png" />

    <meta name="twitter:image" content="https://www.skyoneinternational.com/skyone_logo_clean.png" />

    <!-- Performance: Preconnect & Load Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- LCP Preload: hero background image for faster Largest Contentful Paint -->
    <link rel="preload" as="image" href="/skyone_global_courier_hero.png" fetchpriority="high" />

    <!-- Google Schema.org LocalBusiness & WebSite Structured Data -->
    <script type="application/ld+json">
    [
      {
        "@context": "https://schema.org",
        "@type": ["LocalBusiness", "CourierService"],
        "name": "SkyOne International Courier Service",
        "url": "https://www.skyoneinternational.com",
        "description": "International courier and air cargo service based in Kerala, India. Doorstep pickup across all Kerala districts with express delivery to UAE, Saudi Arabia, UK, USA, Canada, Europe, Germany, Ireland, New Zealand and beyond.",
        "telephone": "+91 79075 90062",
        "email": "skyonesupport@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "SNDP Union Bldg, Ground Floor, Shop No 744, Near My G Showroom, M C Road",
          "addressLocality": "Thiruvalla, Pathanamthitta",
          "addressRegion": "Kerala",
          "postalCode": "689101",
          "addressCountry": "IN"
        },
        "areaServed": [
          "Kochi", "Thiruvananthapuram", "Kozhikode", "Thrissur",
          "Malappuram", "Kannur", "Kollam", "Palakkad", "Kerala", "India"
        ],
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
          "opens": "08:30",
          "closes": "20:30"
        }
        /* TODO: Add geo (GeoCoordinates), logo (verified URL), sameAs (verified social/directory URLs), aggregateRating (when real reviews exist) */
      },
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SkyOne International Courier Service",
        "url": "https://www.skyoneinternational.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://www.skyoneinternational.com/track?awb={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    ]
    </script>

  </head>
  <body class="bg-white text-slate-900 font-sans antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
